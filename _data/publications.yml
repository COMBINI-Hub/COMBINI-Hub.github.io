# Publications shown on the /publications page.
#
# Sections are rendered in the order listed here, and entries within a section
# in the order listed, so keep each section in reverse chronological order.
# References are formatted in Vancouver style by _includes/citation.html.
#
# Fields common to every entry:
#   type      journal | conference | meeting | preprint  (selects the citation format)
#   authors   Vancouver author string: "Family II, Family II, Family II"
#   title     Sentence case, no trailing period
#   year      Publication year (also used for reporting)
#   doi       Bare DOI, rendered as a "doi:" link
#   url       Link to use when there is no DOI, rendered as "Available from:"
#   url_text  Optional link text, when printing the bare URL would be unwieldy
#
# Type-specific fields:
#   journal     venue (NLM journal abbreviation), volume, issue, pages
#   conference  proceedings, month, location, publisher, pages
#   meeting     meeting, month, location, note (e.g. panel, poster)
#   preprint    server (e.g. arXiv, MetaArXiv, medRxiv)

